model:
  admission_predictor:
    type: "xgboost"
    params:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      objective: "binary:logistic"
      random_state: 42
  
  disease_risk_assessor:
    type: "multi_output"
    base_estimator: "lightgbm"
    params:
      n_estimators: 100
      max_depth: 5
      learning_rate: 0.05
      random_state: 42

data:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42

mlflow:
  tracking_uri: "mlruns"
  experiment_name: "medpredict"

api:
  host: "0.0.0.0"
  port: 8000
  reload: true
